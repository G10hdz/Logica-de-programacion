<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logica-de-programacion — status</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      margin-bottom: 0.4rem;
    }
    .sub { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Logica-de-programacion — cuaderno de curso</h1>
    <p class="sub">Repo de notas: "aqui voy a poner todo lo que haga en los cursos de logica de programacion".</p>

    <svg viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lg-title lg-desc">
      <title id="lg-title">Logica-de-programacion: repo de ejercicios</title>
      <desc id="lg-desc">Repositorio de ejercicios de cursos de logica de programacion; por ahora solo contiene README.md que declara su proposito.</desc>
      <rect width="1100" height="300" fill="#f5f5f5"/>

      <rect x="350" y="90" width="400" height="110" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="550" y="130" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">README.md</text>
      <text x="550" y="152" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">declaracion del proposito</text>
      <text x="550" y="172" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">ejercicios — por venir</text>

      <rect x="350" y="230" width="400" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="550" y="255" fill="#4f5d75" font-size="10.5" font-family="'Geist', sans-serif" text-anchor="middle">cuaderno de curso — crece con cada ejercicio nuevo</text>
    </svg>
  </div>
</body>
</html>
